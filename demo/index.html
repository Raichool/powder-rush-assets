<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Powder Rush — assets v3</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f2;font-family:system-ui,sans-serif}
#ui{position:fixed;left:0;right:0;bottom:0;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:linear-gradient(transparent,#0008)}
button{border:0;border-radius:16px;padding:8px 12px;font-weight:700;background:#fff;color:#1E2A4F;font-size:13px}
button.on{background:#F07A1A;color:#fff}#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#info{color:#1E2A4F;font-weight:800;background:#fffc;border-radius:12px;padding:6px 10px;font-size:13px}.sw{width:30px;height:30px;padding:0;border:3px solid #fff}
#load{position:fixed;inset:0;display:grid;place-items:center;font-size:20px;color:#1E2A4F;font-weight:800}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="load">Chargement…</div><div id="top"><span id="info">Powder Rush · assets v3</span><span id="sw"></span><button id="cam">Caméra : orbite</button></div><div id="ui"></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const A='../out/';const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.fog=new THREE.Fog(0xdde8f0,60,190);const C=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,600);C.position.set(4.5,2.2,6);
const ctl=new OrbitControls(C,R.domElement);ctl.target.set(0,1,0);ctl.enableDamping=true;ctl.maxPolarAngle=1.5;ctl.minDistance=2;ctl.maxDistance=40;
const TL=new THREE.TextureLoader();TL.load(A+'sky.jpg',t=>{t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;S.background=t;S.environment=t});
S.add(new THREE.HemisphereLight(0xdfefff,0x9fb3c8,1.2));const sun=new THREE.DirectionalLight(0xfff3e0,2.6);sun.position.set(-20,30,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-25,right:25,top:25,bottom:-25,far:100});S.add(sun);
const st=TL.load(A+'snow_diff.jpg');st.wrapS=st.wrapT=THREE.RepeatWrapping;st.repeat.set(80,80);st.colorSpace=THREE.SRGBColorSpace;
const g=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({map:st,roughness:.9}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;S.add(g);
const L=new GLTFLoader();L.setMeshoptDecoder(MeshoptDecoder);const get=u=>new Promise((a,b)=>L.load(u,a,undefined,b));
const names=['pine_pineDefaultA','pine_pineDefaultB','pine_pineRoundA','pine_pineRoundC','pine_pineTallA','pine_pineTallB','pine_pineSmallA','h_tree_snow_a','h_tree_snow_b','h_tree_snow_c','rock_largeA','rock_largeC','stone_largeA','q_rock_medium1','h_rocks_large','chalet','h_snowman','log_stack','h_lantern','h_bench','h_sled','h_snow_pile','lift_pylon','lift_chair','start_arch','kicker','rail_flat','rail_down','funbox','slalom_gate','safety_net','trail_sign','fence_wood'];
const P={};let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function put(n,x,z,ry=0,s=1){const o=P[n].clone();o.position.set(x,0,z);o.rotation.y=ry;o.scale.setScalar(s);S.add(o);return o}
const [rg]=await Promise.all([get(A+'rider_v3.glb'),...names.map(n=>get(A+'decor/'+n+'.glb').then(x=>{x.scene.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}});P[n]=x.scene}))]);
const pines=names.slice(0,10);for(let i=0;i<160;i++){const x=(rnd()-.5)*150,z=-rnd()*150+20;if(Math.abs(x)<14&&z>-70)continue;put(pines[i%10],x,z,rnd()*6.3,.8+rnd()*.5)}
for(let i=0;i<14;i++)put(names[10+i%5],(rnd()<.5?-1:1)*(16+rnd()*25),-rnd()*90,rnd()*6,.7+rnd()*.6);
put('chalet',-18,-14,.4);put('h_snowman',-12,-8,.6);put('log_stack',-23,-10,1.2);put('h_lantern',-12,-12);put('h_bench',-14,-18,2.6);put('h_sled',-10,-15,.9);put('h_snow_pile',-9,-4);
const chairs=[];for(let i=0;i<6;i++)put('lift_pylon',20,10-i*22);for(let i=0;i<14;i++){const c=put('lift_chair',i%2?17.9:22.1,0);c.position.y=10;c.userData.k=i;chairs.push(c)}
put('start_arch',0,-60);put('kicker',3,-22,-Math.PI/2,1.3);put('rail_flat',-4,-10,Math.PI/2);put('rail_down',-4,-30,Math.PI/2);put('funbox',5,-6,Math.PI/2);
for(let i=0;i<5;i++)put('slalom_gate',(i%2?1:-1)*6,-36-i*5);for(let i=0;i<6;i++)put('safety_net',11,8-i*4.2,Math.PI/2);for(let i=0;i<5;i++)put('fence_wood',-25+i*2.4,-6);put('trail_sign',8,4);
// rider
const rider=rg.scene;rider.traverse(m=>{if(m.isMesh){m.castShadow=true;m.frustumCulled=false}});S.add(rider);
const mix=new THREE.AnimationMixer(rider);const acts={};for(const c of rg.animations)acts[c.name]=mix.clipAction(c);
const once=new Set(['jump','grab_indy','grab_melon','grab_method','spin360_L','spin360_R','flip','land','fall']);
let cur;function play(n){const a=acts[n];if(!a)return;a.reset();a.setLoop(once.has(n)?THREE.LoopOnce:THREE.LoopRepeat);a.clampWhenFinished=true;a.enabled=true;a.setEffectiveWeight(1);if(cur&&cur!==a)a.crossFadeFrom(cur,.2,false);a.play();cur=a;
document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',b.textContent===n))}
mix.addEventListener('finished',e=>{if(e.action===cur&&loopBack.checked)setTimeout(()=>{if(e.action===cur){e.action.reset().play()}},500)});
const ui=document.getElementById('ui');const loopBack={checked:true};
for(const n of Object.keys(acts)){const b=document.createElement('button');b.textContent=n;b.onclick=()=>play(n);ui.appendChild(b)}
// palettes
const pal=await (await fetch(A+'rider_palettes.json')).json();const mats={};rider.traverse(m=>{if(m.isMesh)for(const mt of [].concat(m.material))mats[mt.name]=mt});
const base={};for(const k in mats)base[k]=mats[k].color.getHex();
const sw=document.getElementById('sw');for(const [k,p] of Object.entries(pal)){const b=document.createElement('button');b.className='sw';b.title=k;b.style.background='#'+(p.Jacket||'F07A1A');
b.onclick=()=>{for(const m in mats){mats[m].color.setHex(base[m]);const key=Object.keys(p).find(q=>m.startsWith(q));if(key&&k!=='blue')mats[m].color.set('#'+p[key]).convertSRGBToLinear()}};sw.appendChild(b)}
let follow=false;document.getElementById('cam').onclick=e=>{follow=!follow;e.target.textContent='Caméra : '+(follow?'descente':'orbite')};
document.getElementById('load').remove();play('ride');
const clk=new THREE.Clock();let z=0;R.setAnimationLoop(()=>{const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;mix.update(dt);
for(const c of chairs){const up=c.userData.k%2;let p=((c.userData.k*11+t*2.5)%154);c.position.z=up?12-p:-142+p}
if(follow){z-=dt*8;if(z<-110)z=0;rider.position.set(Math.sin(z*.08)*3,0,z);rider.rotation.y=Math.PI/2+Math.cos(z*.08)*.25;ctl.target.copy(rider.position).y+=1;C.position.lerp(new THREE.Vector3(rider.position.x+1,3,rider.position.z+7),.08)}
else{rider.position.set(0,0,0);rider.rotation.y=Math.PI/2}
ctl.update();R.render(S,C)});
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
